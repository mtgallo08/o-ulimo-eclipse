<main data-planeta="netuno">
  <section class="page-hero compact">
    <div>
      <p class="eyebrow">MISSÃO: NETUNO</p>
      <h1>Escolha um <span>Desafio</span></h1>
      <p class="lead">Selecione uma pergunta para responder.</p>
    </div>
  </section>

  <section class="section">
    <div class="quiz-wrap">
      
      <!-- Lista das 4 perguntas (O jogador clica em uma para abrir) -->
      <div id="lista-perguntas" class="answer-options">
        <h3>Perguntas:</h3>
        <button class="answer-option btn-pergunta" data-id="1">🔹 Pergunta 1</button>
        <button class="answer-option btn-pergunta" data-id="2">🔹 Pergunta 2</button>
        <button class="answer-option btn-pergunta" data-id="3">🔹 Pergunta 3</button>
        <button class="answer-option btn-pergunta" data-id="4">🔹 Pergunta 4</button>
      </div>

      <!-- Caixa onde aparece a pergunta selecionada e as alternativas (inicialmente oculta) -->
      <div id="painel-quiz" class="quiz-box" style="display: none; margin-top: 20px;">
        <h2 id="texto-pergunta">Carregando...</h2>
        <div id="opcoes-respostas" class="answer-options"></div>
        <p id="feedback-resposta" class="feedback"></p>
        <div class="center-actions">
          <button class="button" id="voltar-lista" style="display: none;">← Voltar às Perguntas</button>
        </div>
      </div>

    </div>
  </section>
</main>
